<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TweenJS - Pure Vanilla</title>
  
  <!-- Konva JS - copie locale (9.3.22, meme version que le package npm) :
       doit etre charge avant le bundle. Aucune dependance CDN, marche hors ligne. -->
  <script src="libs/konva.min.js"></script>
  
  <!-- Styles de l'application -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="cookie-bar">
    <span>Ce site n'utilise aucun cookie de suivi ni de traceur publicitaire. Vos préférences d'affichage (largeur des panneaux, etc.) sont seulement enregistrées localement dans votre navigateur. <a class="cookie-bar-link" href="docs/mentions-legales.html">En savoir plus</a></span>
    <button id="cookie-bar-close">Fermer</button>
  </div>
  <div id="app">
    <div id="menubar"></div>
    <div id="project-tabs"></div>
    <div id="main">
      <div id="toolbar"></div>
      <div id="stage-wrap">
        <div id="stage-container"></div>
        <div id="stage-placeholder"></div>
      </div>
      <div id="sidebar-resizer" title="Glisser pour redimensionner"></div>
      <div id="sidebar">
        <div id="library-panel"></div>
        <div id="scripts-panel"></div>
        <div id="properties-panel"></div>
      </div>
    </div>
    <div id="timeline"></div>
  </div>
  
  <!-- CreateJS complet (EaselJS + TweenJS + SoundJS + PreloadJS), copie locale
       MIT dans libs/createjs — injecté dans les scripts utilisateur -->
  <script src="libs/createjs/easeljs.min.js"></script>
  <script src="libs/createjs/tweenjs.min.js"></script>
  <script src="libs/createjs/soundjs.min.js"></script>
  <script src="libs/createjs/preloadjs.min.js"></script>
  
  <!-- Marqueur de contexte vanilla (servage sous-dossier / file://) :
       les liens internes du menu (Mentions légales...) sont RELATIFS ici,
       contrairement à la version main (/src/...). Voir MenuBar.js. -->
  <script>window.__TJS_VANILLA__ = true;</script>
  
  <!-- Bundle de l'application - doit être chargé après les dépendances -->
  <script src="tweenjs-bundle.js"></script>
</body>
</html>
