<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TweenJS - Pure Vanilla</title>
  
  <!-- Konva JS - doit être chargé avant le bundle -->
  <script src="https://unpkg.com/konva@9.3.16/konva.min.js"></script>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@6.0.2/dist/index.css">
  
  <!-- Styles de l'application -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="cookie-bar">
    <span>Ce site n'utilise aucun cookie de suivi ni de traceur publicitaire. Vos préférences d'affichage (largeur des panneaux, etc.) sont seulement enregistrées localement dans votre navigateur. <a class="cookie-bar-link" href="mentions-legales.html">En savoir plus</a></span>
    <button id="cookie-bar-close">Fermer</button>
  </div>
  <div id="app">
    <div id="menubar"></div>
    <div id="main">
      <div id="toolbar"></div>
      <div id="stage-wrap">
        <div id="stage-container"></div>
      </div>
      <div id="sidebar-resizer" title="Glisser pour redimensionner"></div>
      <div id="sidebar">
        <div id="library-panel"></div>
        <div id="scripts-panel"></div>
        <div id="properties-panel"></div>
      </div>
    </div>
    <div id="timeline"></div>
  </div>
  
  <!-- Bundle de l'application - doit être chargé après les dépendances -->
  <script src="tweenjs-bundle.js"></script>
</body>
</html>
