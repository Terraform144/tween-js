<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TweenJS - Pure Vanilla</title>

  <!-- PWA : manifeste, icônes et couleur de thème (service worker en bas de
       page). Chemins RELATIFS : fonctionne aussi servé dans un sous-dossier. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#073642" />

  <!-- Konva JS - copie locale (9.3.22, meme version que le package npm) :
       doit etre charge avant le bundle. Aucune dependance CDN, marche hors ligne. -->
  <script src="libs/konva.min.js"></script>
  
  <!-- Styles de l'application -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="cookie-bar">
    <span>Ce site n'utilise aucun cookie de suivi ni de traceur publicitaire. Vos préférences d'affichage (largeur des panneaux, etc.) sont seulement enregistrées localement dans votre navigateur. <a class="cookie-bar-link" href="docs/mentions-legales.html">En savoir plus</a></span>
    <button id="cookie-bar-close">Fermer</button>
  </div>
  <div id="app">
    <div id="menubar"></div>
    <div id="project-tabs"></div>
    <div id="main">
      <div id="toolbar"></div>
      <div id="stage-wrap">
        <div id="stage-container"></div>
        <div id="stage-placeholder"></div>
      </div>
      <div id="sidebar-resizer" title="Glisser pour redimensionner"></div>
      <div id="sidebar">
        <div id="library-panel"></div>
        <div id="scripts-panel"></div>
        <div id="properties-panel"></div>
      </div>
    </div>
    <div id="timeline"></div>
  </div>
  
  <!-- CreateJS complet (EaselJS + TweenJS + SoundJS + PreloadJS), copie locale
       MIT dans libs/createjs — injecté dans les scripts utilisateur -->
  <script src="libs/createjs/easeljs.min.js"></script>
  <script src="libs/createjs/tweenjs.min.js"></script>
  <script src="libs/createjs/soundjs.min.js"></script>
  <script src="libs/createjs/preloadjs.min.js"></script>
  
  <!-- Marqueur de contexte vanilla (servage sous-dossier / file://) :
       les liens internes du menu (Mentions légales...) sont RELATIFS ici,
       contrairement à la version main (/src/...). Voir MenuBar.js. -->
  <script>window.__TJS_VANILLA__ = true;</script>
  
  <!-- Bundle de l'application - doit être chargé après les dépendances -->
  <script src="tweenjs-bundle.js"></script>

  <!-- PWA : enregistre le service worker puis, une fois actif, lui transmet
       la liste des ressources réellement chargées — le cache hors ligne est
       complet dès la première visite (stratégies dans sw.js). -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var register = function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          return navigator.serviceWorker.ready.then(function () { return reg; });
        }).then(function (reg) {
          var worker = reg.active || reg.waiting || reg.installing;
          if (!worker) return;
          var urls = [
            location.href,
            'manifest.webmanifest',
            'icons/icon-192.png',
            'icons/icon-512.png',
            'icons/apple-touch-icon.png'
          ];
          if (performance && performance.getEntriesByType) {
            performance.getEntriesByType('resource').forEach(function (r) {
              if (r.name && urls.indexOf(r.name) === -1) urls.push(r.name);
            });
          }
          worker.postMessage({ type: 'CACHE_URLS', urls: urls });
        }).catch(function (err) {
          console.warn('[PWA] service worker non enregistré :', err);
        });
      };
      if (document.readyState === 'complete') register();
      else window.addEventListener('load', register);
    })();
  </script>
</body>
</html>
